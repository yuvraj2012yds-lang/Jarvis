name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Missing Environment & Secret Files
      run: |
        touch secrets.properties .env .env.example env.example
        echo "MAPS_API_KEY=dummy_key" >> secrets.properties
        echo "API_KEY=dummy_key" >> secrets.properties
        echo "API_KEY=dummy_key" >> .env
        echo "API_KEY=dummy_key" >> .env.example
        echo "API_KEY=dummy_key" >> env.example

        mkdir -p app
        touch app/secrets.properties app/.env app/.env.example app/env.example
        echo "MAPS_API_KEY=dummy_key" >> app/secrets.properties
        echo "API_KEY=dummy_key" >> app/secrets.properties
        echo "API_KEY=dummy_key" >> app/.env
        echo "API_KEY=dummy_key" >> app/.env.example
        echo "API_KEY=dummy_key" >> app/env.example

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
