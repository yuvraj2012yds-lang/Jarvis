name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Missing Environment & Secret Files
      run: |
        TARGET_DIR="."
        if [ -d "jarvis" ]; then
          TARGET_DIR="jarvis"
        fi

        touch $TARGET_DIR/secrets.properties $TARGET_DIR/.env $TARGET_DIR/.env.example $TARGET_DIR/env.example
        echo "MAPS_API_KEY=dummy_key" >> $TARGET_DIR/secrets.properties
        echo "API_KEY=dummy_key" >> $TARGET_DIR/secrets.properties
        echo "API_KEY=dummy_key" >> $TARGET_DIR/.env
        echo "API_KEY=dummy_key" >> $TARGET_DIR/.env.example
        echo "API_KEY=dummy_key" >> $TARGET_DIR/env.example

        mkdir -p $TARGET_DIR/app
        touch $TARGET_DIR/app/secrets.properties $TARGET_DIR/app/.env $TARGET_DIR/app/.env.example $TARGET_DIR/app/env.example
        echo "MAPS_API_KEY=dummy_key" >> $TARGET_DIR/app/secrets.properties
        echo "API_KEY=dummy_key" >> $TARGET_DIR/app/secrets.properties
        echo "API_KEY=dummy_key" >> $TARGET_DIR/app/.env
        echo "API_KEY=dummy_key" >> $TARGET_DIR/app/.env.example
        echo "API_KEY=dummy_key" >> $TARGET_DIR/app/env.example

    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -d "jarvis" ]; then
          chmod +x jarvis/gradlew
        else
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -d "jarvis" ]; then
          cd jarvis && ./gradlew assembleDebug --no-daemon --stacktrace
        else
          ./gradlew assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
